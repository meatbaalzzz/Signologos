# ============================================================
# Signologos — Nginx Production Configuration
# ============================================================
#
# Responsibilities:
#   - HTTP → HTTPS redirect
#   - SSL termination (Let's Encrypt)
#   - Serve React SPA static files (with SPA fallback)
#   - Reverse-proxy API calls to FastAPI backend
#   - WebSocket proxy for real-time signaling
#   - Cache static assets (models, sign images) aggressively
#   - Security headers (HSTS, CSP, X-Frame-Options, etc.)
#
# Usage:
#   Copy to: /etc/nginx/sites-available/signologos
#   Symlink: ln -s /etc/nginx/sites-available/signologos /etc/nginx/sites-enabled/
#   Test:    nginx -t
#   Reload:  systemctl reload nginx

# Rate limiting zones (protect API and WS from abuse)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=ws_limit:10m  rate=10r/m;

# ── HTTP → HTTPS redirect ──────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name signologos.com www.signologos.com;

    # Allow Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS Main Server ──────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name signologos.com www.signologos.com;

    # SSL Certificates (managed by Certbot)
    ssl_certificate     /etc/letsencrypt/live/signologos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/signologos.com/privkey.pem;

    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ── Security Headers ───────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=*, microphone=*, geolocation=()" always;

    # Content Security Policy
    # - 'self': same origin for scripts, styles
    # - cdn.jsdelivr.net: MediaPipe WASM
    # - storage.googleapis.com: MediaPipe model files
    # - fonts.googleapis.com: Google Fonts
    add_header Content-Security-Policy "
        default-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval' cdn.jsdelivr.net;
        style-src 'self' 'unsafe-inline' fonts.googleapis.com;
        font-src 'self' fonts.gstatic.com;
        img-src 'self' data: blob:;
        media-src 'self' blob:;
        connect-src 'self' wss: ws: cdn.jsdelivr.net storage.googleapis.com;
        worker-src 'self' blob:;
        child-src 'self' blob:;
    " always;

    # ── Gzip Compression ───────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # ── Static Files: React SPA ────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # Cache hashed assets (Vite outputs .hash.js/.hash.css)
    location ~* \.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Cache images and fonts
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # ── ML Models (TensorFlow.js) ──────────────────────────
    location /models/ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        access_log off;
        # Allow large model shards
        client_max_body_size 50M;
    }

    # ── Sign Language Images ───────────────────────────────
    location /signs/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Backend REST API ───────────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Handle CORS for API (optional — FastAPI also handles CORS)
        add_header Access-Control-Allow-Origin "$http_origin" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # ── WebSocket Signaling ────────────────────────────────
    location /ws/ {
        limit_req zone=ws_limit burst=5 nodelay;

        proxy_pass http://backend:8000/ws/;
        proxy_http_version 1.1;

        # Required for WebSocket upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep WebSocket connections alive
        proxy_read_timeout 86400s;  # 24h
        proxy_send_timeout 86400s;
        proxy_connect_timeout 10s;

        # Disable buffering for real-time data
        proxy_buffering off;
        proxy_cache off;
    }

    # ── Health Check (for load balancers) ─────────────────
    location /health {
        proxy_pass http://backend:8000/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # ── SPA Fallback (React Router) ────────────────────────
    # Must be LAST — catch all unmatched routes and serve index.html
    location / {
        try_files $uri $uri/ /index.html;

        # Don't cache the SPA entry point (index.html)
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }
    }

    # ── Error Pages ────────────────────────────────────────
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
